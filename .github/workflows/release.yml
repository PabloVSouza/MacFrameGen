name: Release

# Runs when a version tag is pushed (scripts/release.sh does that): builds, tests and publishes a
# GitHub release with the app zip and the notes from CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build.sh numbers builds by commit count
      - name: Check the tag matches VERSION
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($VERSION)"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build app
        run: ./build.sh
      - name: Self-tests
        run: ./scripts/test.sh
      - name: Package
        run: |
          ZIP="MacFrameGen-$VERSION.zip"
          ditto -c -k --keepParent build/MacFrameGen.app "build/$ZIP"
          (cd build && shasum -a 256 "$ZIP" > "$ZIP.sha256")
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Release notes
        run: |
          scripts/release-notes.sh "$VERSION" > build/notes.md
          [ -s build/notes.md ] || { echo "::error::CHANGELOG.md has no notes for $VERSION"; exit 1; }
          cat >> build/notes.md <<'NOTES'

          ### Install

          Download `MacFrameGen-*.zip`, unzip it and move **MacFrameGen.app** to Applications. Needs an
          Apple Silicon Mac with macOS 26 or later.

          The app isn't notarized, so macOS blocks it the first time. Open it once, then go to
          **System Settings › Privacy & Security** and click **Open Anyway** (or run
          `xattr -dr com.apple.quarantine /Applications/MacFrameGen.app`).
          NOTES
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/$ZIP" "build/$ZIP.sha256" \
            --title "MacFrameGen $VERSION" --notes-file build/notes.md --verify-tag
